<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <link rel="stylesheet" href="/assets/pages.css" />
    <script>
      if (window.parent === window) location.replace("/");
    </script>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <div>
          <h1><span>Games</span></h1>
          <p id="count">Pick something to play.</p>
        </div>
        <form class="search" id="search" autocomplete="off">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="q" type="text" placeholder="Search games..." aria-label="Search games" spellcheck="false" />
        </form>
      </header>
      <nav class="chips" id="cats" aria-label="Categories"></nav>
      <section class="grid" id="grid"></section>
      <p class="empty" id="empty" hidden>No games match that search.</p>
    </main>

    <script src="/assets/common.js"></script>
    <script src="/assets/games.js"></script>
  </body>
</html>
